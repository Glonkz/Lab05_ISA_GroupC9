<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group C9 - Lab 5</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            font-family: monospace;
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            box-sizing: border-box;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
        }

        pre {
            background: #f4f4f4;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1 id="pageTitle"></h1>

    <div class="card">
        <h2 id="insertHeader"></h2>
        <button id="insertBtn" type="button"></button>
    </div>

    <div class="card">
        <h2 id="queryHeader"></h2>
        <textarea id="sqlInput"></textarea>
        <br>
        <button id="submitQueryBtn" type="button"></button>
    </div>

    <div class="card">
        <h3 id="responseHeader"></h3>
        <pre id="responseOutput"></pre>
    </div>

    <script src="./lang/en/en.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
